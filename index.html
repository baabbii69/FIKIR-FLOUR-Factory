<!doctype html>
<html lang="en" style="background-color: #1c1308">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fikir Food Processing | Fortified Flour & Unic Biscuits, Adama Ethiopia</title>
    <meta
      name="description"
      content="Fikir Food Processing makes fortified wheat flour, Unic biscuits and cream wafers in Adama, Ethiopia. Over 15 years, 1,026 employees, delivered nationwide by our own fleet."
    />
    <link rel="canonical" href="https://fikirfoods.et/" />

    <!-- Social sharing. og:image must be an absolute URL; relative paths are
         ignored by Facebook, WhatsApp and Telegram previews. -->
    <meta property="og:site_name" content="Fikir Food Processing" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fikirfoods.et/" />
    <meta property="og:title" content="Fikir Food Processing | Fortified Flour & Unic Biscuits" />
    <meta
      property="og:description"
      content="Fortified wheat flour, Unic biscuits and cream wafers, made in Adama, Ethiopia and delivered nationwide."
    />
    <meta property="og:image" content="https://fikirfoods.et/media/hero-banner-v2.jpg" />
    <meta property="og:image:width" content="1448" />
    <meta property="og:image:height" content="1086" />
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="am_ET" />
    <meta property="og:locale:alternate" content="om_ET" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fikir Food Processing" />
    <meta
      name="twitter:description"
      content="Fortified wheat flour, Unic biscuits and cream wafers, made in Adama, Ethiopia."
    />
    <meta name="twitter:image" content="https://fikirfoods.et/media/hero-banner-v2.jpg" />

    <!-- Structured data. This is the part a search engine can read without
         running any JavaScript, which matters for a client-rendered site: it
         states who the company is, where it is, and how to contact it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://fikirfoods.et/#organization",
        "name": "Fikir Food Processing",
        "alternateName": "ፈቅር ፉድ ፕሮሴስዮንግ",
        "url": "https://fikirfoods.et/",
        "logo": "https://fikirfoods.et/logo-full.png",
        "image": "https://fikirfoods.et/media/hero-banner-v2.jpg",
        "description": "Ethiopian food manufacturer producing fortified wheat flour, Unic biscuits and cream wafers in Adama, Oromia.",
        "foundingDate": "2011",
        "numberOfEmployees": { "@type": "QuantitativeValue", "value": 1026 },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Garalugo, Railway Station Area",
          "addressLocality": "Adama",
          "addressRegion": "Oromia",
          "addressCountry": "ET"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+251911491816",
          "contactType": "sales",
          "email": "contact@fikirfoods.et",
          "areaServed": "ET",
          "availableLanguage": ["en", "am", "om"]
        },
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Fortified wheat flour" } },
          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Unic biscuits" } },
          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Unic cream wafers" } }
        ]
      }
    </script>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#1C1308" />
    <!-- Images and video stream from Sanity's CDN. Warming the connection
         here pays the DNS + TLS cost before the first image is requested,
         which matters most on a slow mobile connection. -->
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link rel="preconnect" href="https://ntiaycof.apicdn.sanity.io" crossorigin />
    <!-- The very first pixels the visitor sees are this mark on the boot
         splash. Without a preload the browser only discovers it after parsing
         and executing the bundle, so the splash shows an empty ring first. -->
    <link rel="preload" as="image" href="/logo-mark.png" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
